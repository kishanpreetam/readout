version: 2

models:
  - name: stg_ctgov__sites
    description: Sites listed on each study, with trimmed text (empty text becomes null) and coordinates set to null when they are out of range or exactly (0, 0).
    data_tests:
      - unique_combination:
          arguments:
            columns: [nct_id, site_order]
    columns:
      - name: nct_id
        data_tests: [not_null]
      - name: site_order
        description: Position of the site in the registry record, starting at 1.
        data_tests: [not_null]
